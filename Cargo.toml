[workspace]
resolver = "2"
members = [
    "crates/cewp-kernel",
    "crates/cewp-csd4",
    "crates/cewp-sim",
    "crates/cewp-adversary",
    "crates/cewp-evidence",
    "crates/cewp-cli",
    "kernel-wasm",
]

# The wasm kernel's build profile (kernel-wasm/build.sh: `cargo build --profile wasm`). A member
# crate's own [profile.*] is ignored inside a workspace, so the settings live here, under a name
# of their own: lto and panic = "abort" must not reach the native CLI through [profile.release].
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
